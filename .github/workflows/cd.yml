name: CD

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  CD:
    name: CD
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - name: Stage release to npm
        run: |
          npm install -g npm@latest
          npm stage publish
