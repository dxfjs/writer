name: CD

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  CD:
    name: CD
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      # A prerelease goes out under its own dist-tag, alpha for 3.0.0-alpha.14,
      # so that latest stays on the stable line. npm refuses a prerelease
      # given no tag, and the tag is passed as a flag because stage publish
      # still staged under latest with publishConfig.tag set (npm 11.20).
      - name: Stage release to npm
        run: |
          npm install -g npm@latest
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) TAG=${VERSION#*-}; TAG=${TAG%%.*} ;;
            *) TAG=latest ;;
          esac
          echo "Staging $VERSION under the $TAG dist-tag"
          npm stage publish --tag "$TAG"
