name: CD

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  CD:
    name: CD
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - name: Stage release to npm
        # bun publish has no OIDC support, so use npm. The trusted publisher is
        # stage-only: this submits a staged release that a maintainer must then
        # approve with 2FA (npm stage approve <id>, or the Staged Packages tab
        # on npmjs.com). No token: auth comes from OIDC.
        run: |
          npm install -g npm@latest
          npm stage publish
